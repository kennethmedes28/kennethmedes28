# Generates the contribution-snake SVGs and pushes them to the "output" branch.
# Copy to .github/workflows/snake.yml in the kennethmedes28/kennethmedes28 profile repo.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: kennethmedes28
          outputs: |
            dist/github-snake.svg?color_snake=%231E90FF&color_dots=%23FFF8DC,%23FCE7A1,%23F5D76E,%23E9B949,%23C99200
            dist/github-snake-dark.svg?color_snake=%231E90FF&color_dots=%23FFF8DC,%23FCE7A1,%23F5D76E,%23E9B949,%23C99200

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
