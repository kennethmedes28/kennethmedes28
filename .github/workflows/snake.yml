# Generates the contribution-snake SVGs and pushes them to the "output" branch.
# Copy to .github/workflows/snake.yml in the kennethmedes28/kennethmedes28 profile repo.
name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # manual run button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: kennethmedes28
          outputs: |
            dist/github-snake.svg?palette=forgejo-light
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
